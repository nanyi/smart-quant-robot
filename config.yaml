notifier:
  enabled: true
  provider: "dingding"  # dingding | weixin

dingding:
  enabled: true
  token: ""
  token2: ""

weixin:
  enabled: false
  corp_id: ""
  secret: ""
  agent_id: 0
  to_user: "@all"

binance:
  api_key: ""
  api_secret: ""
  recv_window: 5000
  proxy:
    enabled: false
    host: "127.0.0.1"
    port: 7890

trade:
  strategy:
    ma:
      short_period: 5
      long_period: 60
  kLine_type: '15m'
  binance_market: "SPOT"
  binance_coinBase: "USDT"
  binance_coinBase_count: 20
  binance_tradeCoin: "DOGE"
  isOpenSellStrategy: true
  sellStrategy1:
    profit: 1.05
    sell: 0.1
  sellStrategy2:
    profit: 1.10
    sell: 0.2
  sellStrategy3:
    profit: 1.20
    sell: 0.2

sqlite:
  enabled: true
  db_path: "/data/db/smart_quant_robot.db"

strategy:
  enabled_strategies:
    - "ma"
    - "rsi"
    - "bollinger"
    - "macd"
    - "volatility"
    - "volume"
  weights:
    ma: 1.0
    rsi: 0.8
    bollinger: 0.8
    macd: 0.8
    volatility: 0.7
    volume: 0.7
  threshold: 0.5

backtest:
  enabled: true
  initial_capital: 10000.0
  commission_rate: 0.001
  data_limit: 1000