notifier:
  enabled: true
  provider: "dingding"  # dingding | weixin

dingding:
  enabled: true
  token: ""
  token2: ""

weixin:
  enabled: false
  corp_id: ""
  secret: ""
  agent_id: 0
  to_user: "@all"

binance:
  api_key: ""
  api_secret: ""
  recv_window: 5000
  proxy:
    enabled: false
    host: "127.0.0.1"
    port: 7890

trade:
  kLine_type: '15m'
  binance_market: "SPOT"
  binance_coinBase: "USDT"
  binance_coinBase_count: 20
  binance_tradeCoin: "DOGE"
  isOpenSellStrategy: true
  sellStrategy1:
    profit: 1.05
    sell: 0.1
  sellStrategy2:
    profit: 1.10
    sell: 0.2
  sellStrategy3:
    profit: 1.20
    sell: 0.2

sqlite:
  enabled: true
  db_path: "/data/db/smart_quant_robot.db"

strategy:
  enabled_strategies:
    - "ma"
    - "rsi"
    - "bollinger"
    - "macd"
    - "volatility"
    - "volume"
    - "lifemore"
    - "turtle"
    - "nbreak"
  weights:
    ma: 1.0
    rsi: 0.8
    bollinger: 0.8
    macd: 0.8
    volatility: 0.7
    volume: 0.7
    lifemore: 1.0
    turtle: 1.0
    nbreak: 1.0
  threshold: 0.5
  ma:
    short_period: 5
    long_period: 60
  lifemore:
    breakout_period: 30
    pyramid_ratio: 0.05
    stop_loss_ratio: 0.10
    exit_ratio: 0.20
  turtle:
    entry_period: 20
    exit_period: 10
    atr_period: 20
    risk_ratio: 0.02
    max_units: 4
  nbreak:
    ma_period: 20
    strong_rise_period: 10
    strong_rise_min_count: 3
    strong_rise_body_ratio: 1.5
    volume_amplify_ratio: 1.5
    pullback_volume_ratio: 0.7
    breakout_volume_ratio: 1.2
    breakout_threshold: 0.01
    atr_period: 20
    atr_stop_loss_ratio: 2.0

backtest:
  enabled: true
  initial_capital: 10000.0
  commission_rate: 0.001
  data_limit: 1000